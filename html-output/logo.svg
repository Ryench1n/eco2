<!-- ECO Gaming Logo SVG -->
<svg width="140" height="50" viewBox="0 0 140 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle/Badge -->
  <circle cx="20" cy="25" r="18" fill="url(#logoGradient)" opacity="0.2"/>
  
  <!-- Gaming Controller Icon -->
  <path d="M15 20 L15 18 Q15 16 17 16 L23 16 Q25 16 25 18 L25 20" 
        stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="18" cy="23" r="1.5" fill="url(#logoGradient)"/>
  <circle cx="22" cy="23" r="1.5" fill="url(#logoGradient)"/>
  <path d="M17 28 L17 30 Q17 32 19 32 L21 32 Q23 32 23 30 L23 28" 
        stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <rect x="12" y="20" width="16" height="8" rx="2" stroke="url(#logoGradient)" 
        stroke-width="2.5" fill="none"/>
  
  <!-- ECO Text -->
  <text x="45" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
        fill="url(#logoGradient)">ECO</text>
  
  <!-- Gaming Subtitle -->
  <text x="45" y="43" font-family="Arial, sans-serif" font-size="8" 
        fill="#9ca3af" letter-spacing="2">GAMING</text>
</svg>
