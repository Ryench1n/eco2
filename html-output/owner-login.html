<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эзэмшигч нэвтрэх - ECO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(to bottom right, rgba(88, 28, 135, 0.4), var(--bg-primary), rgba(88, 28, 135, 0.6));">
    <div style="width: 100%; max-width: 96rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center;">
      <!-- Left Side - Branding -->
      <div class="hidden md:flex flex-col items-center justify-center animate-fade-in">
        <div class="mb-6 relative">
          <div style="position: absolute; inset: 0; background: linear-gradient(to bottom right, var(--purple-600), var(--cyan-500)); border-radius: 1.5rem; filter: blur(60px); opacity: 0.3;"></div>
          <img src="logo.svg" alt="ECO Logo" style="height: 12rem; width: auto; position: relative; z-index: 10;">
        </div>
        <p class="text-gray-400 text-center text-lg">
          Өөрийн тоглоомын төвийг бүртгэх,<br>
          удирдах, статистик харах
        </p>
      </div>

      <!-- Right Side - Login Form -->
      <div class="animate-fade-in">
        <div class="card" style="background: rgba(26, 26, 36, 0.8); backdrop-filter: blur(10px);">
          <div class="card-content p-8">
            <!-- Tabs -->
            <div class="flex gap-4 mb-8">
              <button class="btn btn-primary" style="flex: 1; padding: 0.75rem 1.5rem; font-weight: 600;">
                Нэвтрэх
              </button>
              <button class="btn" style="flex: 1; padding: 0.75rem 1.5rem; font-weight: 600; background: transparent; color: var(--gray-400);">
                Бүртгүүлэх
              </button>
            </div>

            <h2 class="text-2xl font-bold text-white mb-2">Эзэмшигч нэвтрэх</h2>
            <p class="text-gray-400 text-sm mb-6">Өөрийн мэдээллээ оруулж нэвтрэнэ үү</p>

            <form onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 1.25rem;">
              <!-- Email Input -->
              <div>
                <label class="text-gray-300 text-sm mb-2" style="display: block;">
                  Имэйл хаяг эсвэл төвийн нэр
                </label>
                <div class="input-group">
                  <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                  </svg>
                  <input type="text" class="input" placeholder="email@example.com эсвэл төвийн нэр">
                </div>
              </div>

              <!-- Password Input -->
              <div>
                <div class="flex items-center justify-between mb-2">
                  <label class="text-gray-300 text-sm">Нууц үг</label>
                  <button type="button" class="text-purple-400 text-sm hover:text-purple-300">
                    Нууц үгээ мартсан?
                  </button>
                </div>
                <div class="input-group">
                  <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                  </svg>
                  <input type="password" class="input" placeholder="•••••••">
                </div>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary btn-lg">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                </svg>
                Нэвтрэх
              </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
              <div style="position: absolute; inset: 0; display: flex; align-items: center;">
                <div style="width: 100%; border-top: 1px solid rgba(168, 85, 247, 0.3);"></div>
              </div>
              <div class="relative flex justify-center text-sm">
                <span class="px-4 text-gray-400" style="background: var(--bg-card);">эсвэл</span>
              </div>
            </div>

            <!-- Social Login -->
            <div class="grid grid-cols-2 gap-4">
              <button class="btn btn-outline" style="height: 3rem;">
                <svg class="icon" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
                </svg>
                Google
              </button>
              <button class="btn btn-outline" style="height: 3rem;">
                <svg class="icon" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
                </svg>
                Facebook
              </button>
            </div>

            <!-- Footer -->
            <div class="text-center mt-6">
              <p class="text-gray-400 text-sm">
                Бүртгэлгүй юу? 
                <button type="button" class="text-purple-400 hover:text-purple-300 font-semibold">
                  Бүртгүүлэх
                </button>
              </p>
              <div class="flex items-center justify-center gap-4 mt-4 text-sm">
                <a href="login.html" class="text-cyan-400 hover:text-cyan-300">
                  ← Сонголт руу буцах
                </a>
                <span class="text-gray-600">•</span>
                <a href="index.html" class="text-purple-400 hover:text-purple-300">
                  Нүүр хуудас
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      alert('Амжилттай нэвтэрлээ!');
      window.location.href = 'owner-dashboard.html';
    }
  </script>
</body>
</html>
