<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нэвтрэх - ECO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(to bottom right, rgba(88, 28, 135, 0.4), var(--bg-primary), rgba(88, 28, 135, 0.6));">
    <div style="width: 100%; max-width: 80rem;">
      <!-- Header -->
      <div class="text-center mb-12 animate-fade-in">
        <div class="flex items-center justify-center gap-4 mb-4">
          <img src="logo.svg" alt="ECO Logo" style="height: 5rem; width: auto;">
        </div>
        <p class="text-gray-400 text-lg">Тоглоомын төвүүдийг нэг дороос</p>
      </div>

      <!-- Login Options -->
      <div class="grid grid-cols-2 gap-8 mb-12">
        <!-- User Login Option -->
        <div class="card animate-fade-in" style="background: rgba(26, 26, 36, 0.8); backdrop-filter: blur(10px);">
          <div class="card-content p-8">
            <div class="text-center mb-6">
              <div class="flex items-center justify-center" style="width: 4rem; height: 4rem; background: rgba(147, 51, 234, 0.2); border-radius: 1rem; margin: 0 auto 1rem;">
                <svg class="icon-lg text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              <h2 class="text-2xl font-bold text-white mb-3">Энгийн хэрэглэгч</h2>
              <p class="text-gray-400 text-sm">
                Тоглоомын төвүүдийг хайж олох, захиалга өгөх, сул суудал шалгах
              </p>
            </div>
            <a href="user-login.html" class="btn btn-primary" style="width: 100%; height: 3rem; font-size: 1rem; font-weight: 600;">
              <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              Нэвтрэх
            </a>
            <button class="btn" style="width: 100%; margin-top: 0.75rem; background: transparent; color: var(--gray-400);">
              Бүртгүүлэх
            </button>
          </div>
        </div>

        <!-- Owner Login Option -->
        <div class="card animate-fade-in" style="background: rgba(26, 26, 36, 0.8); backdrop-filter: blur(10px);">
          <div class="card-content p-8">
            <div class="text-center mb-6">
              <div class="flex items-center justify-center" style="width: 4rem; height: 4rem; background: rgba(147, 51, 234, 0.2); border-radius: 1rem; margin: 0 auto 1rem;">
                <svg class="icon-lg text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                </svg>
              </div>
              <h2 class="text-2xl font-bold text-white mb-3">Эзэмшигч</h2>
              <p class="text-gray-400 text-sm">
                Өөрийн тоглоомын төвийг бүртгэх, удирдах, статистик харах
              </p>
            </div>
            <a href="owner-login.html" class="btn btn-primary" style="width: 100%; height: 3rem; font-size: 1rem; font-weight: 600;">
              <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
              </svg>
              Нэвтрэх
            </a>
            <button class="btn" style="width: 100%; margin-top: 0.75rem; background: transparent; color: var(--gray-400);">
              Бүртгүүлэх
            </button>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-3 gap-8 animate-fade-in" style="max-width: 48rem; margin: 0 auto;">
        <div class="text-center">
          <div class="text-3xl font-bold text-white mb-1">50+</div>
          <div class="text-gray-400 text-sm">Тоглоомын төвүүд</div>
        </div>
        <div class="text-center">
          <div class="text-3xl font-bold text-white mb-1">10k+</div>
          <div class="text-gray-400 text-sm">Идэвхтэй хэрэглэгчид</div>
        </div>
        <div class="text-center">
          <div class="text-3xl font-bold text-white mb-1">4.8+</div>
          <div class="text-gray-400 text-sm">Дундаж үнэлгээ</div>
        </div>
      </div>

      <!-- Back to Home -->
      <div class="text-center mt-8">
        <a href="index.html" class="text-gray-400 hover:text-purple-400">← Нүүр хуудас руу буцах</a>
      </div>
    </div>
  </div>
</body>
</html>
