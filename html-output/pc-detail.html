<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Төв Дэлгэрэнгүй - ECO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <div class="navbar-content">
        <a href="index.html" class="navbar-logo">
          <img src="logo.svg" alt="ECO Logo">
        </a>
        <div class="navbar-auth">
          <a href="login.html" class="btn btn-outline">
            <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            Нэвтрэх
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="min-h-screen bg-primary py-8">
    <div class="container">
      <!-- Breadcrumb -->
      <div class="flex items-center gap-2 text-sm text-gray-400 mb-6">
        <a href="index.html" class="hover:text-purple-400">Нүүр</a>
        <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
        <span class="text-white" id="centerName"></span>
      </div>

      <div class="grid" style="grid-template-columns: 2fr 1fr; gap: 2rem;">
        <!-- Left Column -->
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
          <!-- Hero Image -->
          <div class="card animate-fade-in" id="heroSection">
            <!-- Filled by JS -->
          </div>

          <!-- Description -->
          <div class="card animate-fade-in">
            <div class="card-header">
              <h3 class="text-white font-bold flex items-center gap-2">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path>
                </svg>
                Танилцуулга
              </h3>
            </div>
            <div class="card-content">
              <p class="text-gray-300" id="description"></p>
            </div>
          </div>

          <!-- Gears -->
          <div class="card animate-fade-in">
            <div class="card-header">
              <h3 class="text-white font-bold flex items-center gap-2">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                Төхөөрөмж
              </h3>
            </div>
            <div class="card-content">
              <div class="grid grid-cols-2 gap-4" id="gearsGrid">
                <!-- Filled by JS -->
              </div>
            </div>
          </div>

          <!-- Reviews -->
          <div class="card animate-fade-in">
            <div class="card-header">
              <h3 class="text-white font-bold flex items-center gap-2">
                <svg class="icon" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                </svg>
                Хэрэглэгчийн сэтгэгдэл
              </h3>
            </div>
            <div class="card-content" id="reviewsSection">
              <!-- Filled by JS -->
            </div>
          </div>
        </div>

        <!-- Right Column (Sidebar) -->
        <div>
          <div class="card animate-fade-in" style="position: sticky; top: 6rem;">
            <div class="card-header">
              <h3 class="text-white font-bold">Холбоо барих</h3>
            </div>
            <div class="card-content" style="display: flex; flex-direction: column; gap: 1rem;">
              <!-- Contact Info -->
              <div id="contactInfo" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <!-- Filled by JS -->
              </div>

              <div style="height: 1px; background: rgba(168, 85, 247, 0.2);"></div>

              <!-- Opening Hours -->
              <div>
                <div class="flex items-center gap-2 mb-3">
                  <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                  <h4 class="font-semibold text-white">Цагийн хуваарь</h4>
                </div>
                <div id="openingHours" style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.875rem;">
                  <!-- Filled by JS -->
                </div>
              </div>

              <div style="height: 1px; background: rgba(168, 85, 247, 0.2);"></div>

              <!-- Pricing -->
              <div>
                <h4 class="font-semibold text-white mb-3">Үнэ (цаг тутам)</h4>
                <div id="pricing" style="display: flex; flex-direction: column; gap: 0.5rem;">
                  <!-- Filled by JS -->
                </div>
              </div>

              <button class="btn btn-gradient btn-lg" onclick="bookNow()">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                Захиалах
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Sample Data
    const pcCenters = {
      "1": {
        id: "1",
        name: "Dragon Gaming Lounge",
        address: "Сүхбаатар дүүрэг, 15-р байр",
        image: "https://images.unsplash.com/photo-1593305841991-05c297ba4575?w=800&q=80",
        rating: 4.8,
        reviewCount: 156,
        description: "Тав тухтай орчин, найрсаг хамт олон",
        gears: {
          cpu: "Intel Core i9-13900K",
          gpu: "NVIDIA RTX 4080",
          ram: "32GB DDR5",
          monitor: "ASUS ROG Swift 27\" 240Hz",
          keyboard: "Razer BlackWidow V3",
          mouse: "Logitech G Pro X Superlight"
        },
        contactPhone: "+976 7777-8888",
        facebookPage: "fb.com/dragongaminglounge",
        openingHours: {
          Monday: "10:00 - 23:00",
          Tuesday: "10:00 - 23:00",
          Wednesday: "10:00 - 23:00",
          Thursday: "10:00 - 23:00",
          Friday: "10:00 - 01:00",
          Saturday: "10:00 - 01:00",
          Sunday: "10:00 - 23:00"
        },
        pricing: { hall: 3000, vip: 5000, stage: 7000 }
      }
    };

    const reviews = [
      {
        userName: "Батболд",
        userAvatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&q=80",
        rating: 5,
        comment: "Good",
        date: "2026-03-15"
      },
      {
        userName: "Энхжин",
        userAvatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&q=80",
        rating: 5,
        comment: "Best gaming setup",
        date: "2026-03-10"
      }
    ];

    // Get ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const centerId = urlParams.get('id') || '1';
    const pcCenter = pcCenters[centerId];

    if (!pcCenter) {
      document.body.innerHTML = '<div class="container py-16 text-center"><h2 class="text-white">Тоглоомын төв олдсонгүй</h2></div>';
    }

    // Render page
    document.getElementById('centerName').textContent = pcCenter.name;

    // Hero
    document.getElementById('heroSection').innerHTML = `
      <div style="position: relative; height: 24rem;">
        <img src="${pcCenter.image}" alt="${pcCenter.name}" class="img-cover">
        <div style="position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-card), transparent);"></div>
        <div style="position: absolute; bottom: 1.5rem; left: 1.5rem; right: 1.5rem;">
          <h1 class="text-4xl font-bold text-white mb-3">${pcCenter.name}</h1>
          <div class="flex items-center gap-4 flex-wrap">
            <span class="badge text-lg" style="padding: 0.5rem 1rem;">
              <svg class="icon-sm" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
              </svg>
              ${pcCenter.rating} (${pcCenter.reviewCount} сэтгэгдэл)
            </span>
            <div class="flex items-center gap-2 text-gray-300">
              <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              <span class="text-sm">${pcCenter.address}</span>
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('description').textContent = pcCenter.description;

    // Gears
    const gearsHTML = Object.entries(pcCenter.gears).map(([key, value]) => `
      <div class="flex items-center gap-3 p-4 bg-secondary rounded-lg" style="border: 1px solid rgba(168, 85, 247, 0.2);">
        <svg class="icon-lg text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
        </svg>
        <div>
          <div class="text-sm text-gray-500">${key.toUpperCase()}</div>
          <div class="text-white font-semibold">${value}</div>
        </div>
      </div>
    `).join('');
    document.getElementById('gearsGrid').innerHTML = gearsHTML;

    // Reviews
    const reviewsHTML = reviews.map(review => `
      <div class="p-4 bg-secondary rounded-lg mb-4" style="border: 1px solid rgba(168, 85, 247, 0.2);">
        <div class="flex items-start gap-4">
          <img src="${review.userAvatar}" alt="${review.userName}" style="width: 3rem; height: 3rem; border-radius: 9999px;">
          <div style="flex: 1;">
            <div class="flex items-center justify-between mb-2">
              <h4 class="font-semibold text-white">${review.userName}</h4>
              <div class="flex gap-1">
                ${Array(5).fill(0).map((_, i) => `
                  <svg class="star ${i < review.rating ? 'filled' : ''}" fill="${i < review.rating ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                  </svg>
                `).join('')}
              </div>
            </div>
            <p class="text-gray-300 text-sm mb-2">${review.comment}</p>
            <span class="text-sm text-gray-500">${review.date}</span>
          </div>
        </div>
      </div>
    `).join('');
    document.getElementById('reviewsSection').innerHTML = reviewsHTML;

    // Contact
    document.getElementById('contactInfo').innerHTML = `
      <a href="tel:${pcCenter.contactPhone}" class="flex items-center gap-3 p-3 bg-secondary rounded-lg" style="border: 1px solid rgba(168, 85, 247, 0.2); text-decoration: none;">
        <svg class="icon text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
        </svg>
        <div>
          <div class="text-sm text-gray-500">Утас</div>
          <div class="text-white text-sm">${pcCenter.contactPhone}</div>
        </div>
      </a>
      <a href="https://${pcCenter.facebookPage}" target="_blank" class="flex items-center gap-3 p-3 bg-secondary rounded-lg" style="border: 1px solid rgba(168, 85, 247, 0.2); text-decoration: none;">
        <svg class="icon text-purple-500" fill="currentColor" viewBox="0 0 24 24">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
        </svg>
        <div>
          <div class="text-sm text-gray-500">Facebook</div>
          <div class="text-white text-sm">${pcCenter.facebookPage}</div>
        </div>
      </a>
    `;

    // Opening Hours
    document.getElementById('openingHours').innerHTML = Object.entries(pcCenter.openingHours).map(([day, hours]) => `
      <div class="flex justify-between">
        <span class="text-gray-400">${day}</span>
        <span class="text-white">${hours}</span>
      </div>
    `).join('');

    // Pricing
    document.getElementById('pricing').innerHTML = `
      <div class="flex justify-between items-center p-2 bg-secondary rounded" style="border: 1px solid rgba(168, 85, 247, 0.2);">
        <span class="text-gray-400">Hall</span>
        <span class="text-white font-semibold">₮${pcCenter.pricing.hall}</span>
      </div>
      <div class="flex justify-between items-center p-2 bg-secondary rounded" style="border: 1px solid rgba(168, 85, 247, 0.2);">
        <span class="text-gray-400">VIP</span>
        <span class="text-purple-400 font-semibold">₮${pcCenter.pricing.vip}</span>
      </div>
      <div class="flex justify-between items-center p-2 bg-secondary rounded" style="border: 1px solid rgba(168, 85, 247, 0.2);">
        <span class="text-gray-400">Stage</span>
        <span class="text-cyan-400 font-semibold">₮${pcCenter.pricing.stage}</span>
      </div>
    `;

    function bookNow() {
      window.location.href = `booking.html?id=${centerId}`;
    }
  </script>
</body>
</html>
