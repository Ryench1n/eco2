<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профайл - ECO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <div class="navbar-content">
        <a href="index.html" class="navbar-logo">
          <img src="logo.svg" alt="ECO Logo">
        </a>
        <div class="navbar-auth">
          <a href="index.html" class="btn btn-outline">Гарах</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="min-h-screen bg-primary py-8">
    <div class="container" style="max-width: 80rem;">
      <h1 class="text-3xl font-bold text-white mb-8">Профайл</h1>

      <div class="grid" style="grid-template-columns: 1fr 2fr; gap: 2rem;">
        <!-- Profile Info -->
        <div>
          <div class="card animate-fade-in">
            <div class="card-content p-6 text-center">
              <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80" alt="User Avatar" style="width: 8rem; height: 8rem; border-radius: 9999px; margin: 0 auto 1rem; border: 4px solid rgba(168, 85, 247, 0.5);">
              
              <h2 class="text-2xl font-bold text-white mb-1">Batbold Ganbaatar</h2>
              <p class="text-gray-400 mb-4">batbold@email.com</p>
              
              <span class="badge-outline mb-6" style="display: inline-block;">
                Хэрэглэгч болсон огноо January 2026
              </span>

              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div class="p-4 bg-secondary rounded-lg" style="border: 1px solid rgba(168, 85, 247, 0.2);">
                  <div class="text-3xl font-bold text-purple-400 mb-1">3</div>
                  <div class="text-gray-400 text-sm">Нийт захиалга</div>
                </div>
                <div class="p-4 bg-secondary rounded-lg" style="border: 1px solid rgba(168, 85, 247, 0.2);">
                  <div class="text-3xl font-bold text-cyan-400 mb-1">1</div>
                  <div class="text-gray-400 text-sm">Хүлээгдэж буй захиалга</div>
                </div>
              </div>

              <button class="btn btn-primary mt-6" style="width: 100%;">Профайл засах</button>
            </div>
          </div>
        </div>

        <!-- Bookings -->
        <div>
          <div class="card animate-fade-in">
            <div class="card-header">
              <h3 class="text-white font-bold">Захиалгын түүх</h3>
            </div>
            <div class="card-content" style="display: flex; flex-direction: column; gap: 1rem;">
              <!-- Booking 1 -->
              <div class="p-4 bg-secondary rounded-lg" style="border: 1px solid rgba(168, 85, 247, 0.2);">
                <div class="flex items-start justify-between mb-3">
                  <div>
                    <h4 class="font-semibold text-white mb-1">Dragon Gaming Lounge</h4>
                    <span class="badge" style="background: rgba(34, 197, 94, 0.2); color: rgb(134, 239, 172); border: 1px solid rgba(34, 197, 94, 0.5);">
                      Upcoming
                    </span>
                  </div>
                  <div class="text-right">
                    <div class="text-xl font-bold text-purple-400">₮12,000</div>
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-3 text-sm">
                  <div class="flex items-center gap-2 text-gray-400">
                    <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <span>2026-03-25</span>
                  </div>
                  <div class="flex items-center gap-2 text-gray-400">
                    <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>14:00</span>
                  </div>
                  <div class="flex items-center gap-2 text-gray-400" style="grid-column: span 2;">
                    <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    </svg>
                    <span>Суудал: 5, 6</span>
                  </div>
                </div>
              </div>

              <!-- Booking 2 -->
              <div class="p-4 bg-secondary rounded-lg" style="border: 1px solid rgba(168, 85, 247, 0.2);">
                <div class="flex items-start justify-between mb-3">
                  <div>
                    <h4 class="font-semibold text-white mb-1">Phoenix Gaming Hub</h4>
                    <span class="badge" style="background: rgba(75, 85, 99, 0.2); color: var(--gray-300); border: 1px solid rgba(75, 85, 99, 0.5);">
                      Completed
                    </span>
                  </div>
                  <div class="text-right">
                    <div class="text-xl font-bold text-purple-400">₮7,000</div>
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-3 text-sm">
                  <div class="flex items-center gap-2 text-gray-400">
                    <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <span>2026-03-18</span>
                  </div>
                  <div class="flex items-center gap-2 text-gray-400">
                    <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>16:00</span>
                  </div>
                  <div class="flex items-center gap-2 text-gray-400" style="grid-column: span 2;">
                    <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    </svg>
                    <span>Суудал: 12</span>
                  </div>
                </div>
              </div>

              <div class="text-center pt-4">
                <a href="index.html" class="btn btn-outline">Захиалга хийх</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
