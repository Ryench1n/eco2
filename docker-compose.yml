version: '3.9'

services:
  # MongoDB database
  mongodb:
    image: mongo:7
    container_name: eco-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: eco_production
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - eco-net

  # Express.js backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eco-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: eco_production
      JWT_SECRET: ${JWT_SECRET:-eco-change-this-secret-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - eco-net

  # React frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eco-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - eco-net

volumes:
  mongo_data:

networks:
  eco-net:
    driver: bridge
